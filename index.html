<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fourteen</title>

<!-- Home-screen web app. Without apple-mobile-web-app-capable it opens as a
     normal Safari tab with the address bar taking a third of the screen. -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Fourteen">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#EDEFF4">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="apple-touch-icon.png">

<style>
  html { background: #EDEFF4; }
  body {
    margin: 0;
    background: #EDEFF4;
    -webkit-text-size-adjust: 100%;
    -webkit-tap-highlight-color: transparent;
    /* Keeps content clear of the notch and the home indicator in
       standalone mode. Harmless when the insets are zero. */
    padding: env(safe-area-inset-top) env(safe-area-inset-right)
             env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  #root { min-height: 100vh; }
  #boot {
    font: 15px -apple-system, "Segoe UI", sans-serif;
    color: #5E6580; padding: 28px 20px;
  }
</style>
</head>

        @import url('https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800&family=Inter:wght@400;500;600&display=swap');

        .f-root {
          --ink:#1B2340; --ground:#EDEFF4; --card:#FFFFFF;
          --hard:#3B4A9E; --func:#9BA6DD; --rest:#C9CEE0;
          --surface:#3B4A9E; --on-surface:#C6CDEE;
          --acid:#CADB4A; --onacid:#2E3A05;
          --rule:#CDD3E2; --muted:#5E6580; --warn:#A8465E;
          background:var(--ground); color:var(--ink); min-height:100vh;
          font-family:"Inter",-apple-system,"Segoe UI",sans-serif;
          font-size:15px; line-height:1.5; padding-bottom:56px;
          font-variant-numeric:tabular-nums;
        }
        .f-wrap { max-width:560px; margin:0 auto; padding:0 18px; }

        /* Header and tabs stay put while the content scrolls under them.
           This sits outside the padded column so its background reaches the
           screen edges \u2014 otherwise content shows through at the sides. */
        .f-bar { position:sticky; top:0; z-index:30; background:var(--ground);
          border-bottom:1px solid var(--rule); }

        .f-head { display:flex; align-items:center; justify-content:space-between;
          gap:10px; padding:16px 0 10px; }
        .f-brand { display:flex; align-items:center; gap:10px; min-width:0; }
        .f-logo { font-family:"Archivo",sans-serif; font-weight:800; font-size:23px;
          letter-spacing:-0.035em; margin:0; }
        .f-sub { font-size:10px; letter-spacing:0.1em; text-transform:uppercase;
          color:var(--muted); text-align:right; flex:0 0 auto; line-height:1.35; }

        .f-tabs { display:flex; gap:2px; margin-bottom:0;
          overflow-x:auto; -webkit-overflow-scrolling:touch; flex-wrap:nowrap; }
        .f-tab { background:none; border:none; border-bottom:2px solid transparent;
          padding:10px 13px; font:inherit; font-size:14px; color:var(--muted);
          cursor:pointer; margin-bottom:-1px; flex:0 0 auto; white-space:nowrap; }
        .f-tab[data-on="1"] { color:var(--ink); border-bottom-color:var(--hard); font-weight:600; }
        .f-tab:focus-visible, .f-btn:focus-visible, .f-chip:focus-visible,
        .f-moodbtn:focus-visible, input:focus-visible, .f-mini:focus-visible {
          outline:2px solid var(--hard); outline-offset:2px; }

        .f-card { background:var(--card); border:1px solid var(--rule); border-radius:3px;
          padding:16px; margin-bottom:14px; }
        .f-bar + .f-wrap { padding-top:18px; }
        .f-lab { font-size:11px; letter-spacing:0.11em; text-transform:uppercase;
          color:var(--muted); display:block; margin-bottom:8px; }
        .f-h2 { font-family:"Archivo",sans-serif; font-weight:700; font-size:19px;
          letter-spacing:-0.02em; margin:0 0 10px; }
        .f-note { color:var(--muted); font-size:13.5px; max-width:52ch; }
        .f-alert { background:#F7E4EA; border-left:3px solid var(--warn); color:var(--warn);
          padding:12px 14px; margin-bottom:14px; font-size:13.5px; border-radius:3px; }

        .f-btn { background:var(--hard); color:#fff; border:none; padding:13px 20px;
          font:inherit; font-weight:600; cursor:pointer; border-radius:3px; }
        .f-btn-acid { background:var(--acid); color:var(--onacid); }
        .f-btn-wide { width:100%; }
        .f-mini { border:none; background:none; color:var(--muted); font:inherit;
          font-size:12.5px; cursor:pointer; text-decoration:underline; padding:4px 0; }
        .f-row { display:flex; gap:10px; flex-wrap:wrap; align-items:center; }

        .f-chip { border:1px solid var(--rule); background:none; color:var(--ink);
          padding:11px 15px; font:inherit; font-size:14px; cursor:pointer;
          border-radius:3px; text-align:left; }
        .f-chip[data-on="1"] { background:var(--hard); border-color:var(--hard); color:#fff; }
        .f-chips { display:flex; gap:8px; flex-wrap:wrap; }
        .f-stack { display:flex; flex-direction:column; gap:8px; }
        .f-stack .f-btn { width:100%; }

        /* the booking plate \u2014 the loudest thing in the app, deliberately */
        .f-plate { border-radius:3px; padding:18px; margin-bottom:14px; }
        .f-plate-none { background:var(--acid); color:var(--onacid); }
        .f-plate-soon { background:var(--card); color:var(--ink);
          border:1px solid var(--rule); }
        .f-plate-soon .f-lab { color:var(--muted); }
        .f-plate-soon .f-platenote { color:var(--muted); }
        .f-plate-held { background:var(--surface); color:var(--ground); }
        .f-plate-wait { background:var(--surface); color:var(--ground); border-left:4px solid var(--acid); }
        .f-plate-none .f-lab { color:var(--onacid); opacity:0.72; }
        .f-plate-held .f-lab, .f-plate-wait .f-lab { color:var(--acid); }
        .f-plateline { font-family:"Archivo",sans-serif; font-weight:800; font-size:27px;
          letter-spacing:-0.03em; line-height:1.15; margin:2px 0 8px; }
        .f-platenote { font-size:13.5px; opacity:0.86; max-width:46ch; }
        .f-plate-held .f-platenote, .f-plate-wait .f-platenote { color:var(--on-surface); opacity:1; }

        .f-gauge { display:flex; gap:4px; align-items:flex-end; margin:6px 0 4px; }
        .f-col { flex:1 1 0; min-width:0; text-align:center; }
        .f-track { height:72px; display:flex; align-items:flex-end; border-bottom:1px solid var(--ink); }
        .f-bar { width:100%; border-radius:2px 2px 0 0; }
        .f-bar-hard { height:100%; background:var(--hard); }
        .f-bar-functional { height:45%; background:var(--func); }
        .f-bar-rest { height:7px; background:var(--rest); }
        .f-bar-none { height:0; }
        .f-bar-future { height:5px; background:var(--rest); opacity:0.55; }
        .f-bar[data-today="1"] { outline:2px solid var(--acid); outline-offset:1px; }
        .f-tick { display:block; font-size:10px; color:var(--muted); margin-top:5px; }

        .f-weeks { margin:14px 0 2px; }
        .f-wplot { position:relative; height:66px; display:flex; gap:5px;
          align-items:flex-end; border-bottom:1px solid var(--ink); }
        .f-weeksline { position:absolute; left:0; right:0; height:0;
          border-top:1px dashed var(--hard); z-index:1; }
        .f-weeksline span { position:absolute; right:0; top:2px; font-size:10px;
          color:var(--hard); font-weight:600; background:var(--card); padding:0 3px; }
        .f-wcol { flex:1 1 0; min-width:0; height:100%; display:flex; align-items:flex-end; }
        .f-wbar { width:100%; background:var(--hard); border-radius:2px 2px 0 0; }
        .f-wbar[data-part="1"] { background:var(--acid); }
        .f-wlabels { display:flex; gap:5px; margin-top:5px; }
        .f-wlabels span { flex:1 1 0; min-width:0; text-align:center;
          font-size:10px; color:var(--muted); }

        .f-big { font-family:"Archivo",sans-serif; font-weight:800; font-size:42px;
          letter-spacing:-0.04em; line-height:1; }
        .f-big small { font-size:15px; font-weight:500; color:var(--muted);
          letter-spacing:0; margin-left:7px; }

        .f-mood { display:flex; gap:7px; align-items:center; flex-wrap:wrap; }
        .f-moodbtn { width:46px; height:46px; border:1px solid var(--rule); background:var(--card);
          color:var(--ink); font:inherit; font-size:16px; cursor:pointer; border-radius:3px; }
        .f-moodbtn[data-on="1"] { background:var(--acid); border-color:var(--acid);
          color:var(--onacid); font-weight:700; }
        .f-moodlab { font-size:12px; color:var(--muted); }

        .f-entry { display:flex; justify-content:space-between; align-items:center; gap:10px;
          padding:9px 0; border-bottom:1px solid var(--rule); font-size:14px; }
        .f-entry:last-child { border-bottom:none; }
        .f-done { display:flex; align-items:center; gap:9px; }
        .f-dot { width:9px; height:9px; border-radius:2px; background:var(--hard);
          flex:0 0 auto; }
        .f-tag { font-size:11px; letter-spacing:0.06em; text-transform:uppercase;
          color:var(--muted); margin-left:6px; }

        .f-stat { display:flex; gap:18px; flex-wrap:wrap; margin-top:6px; }
        .f-stat div { min-width:76px; }
        .f-statn { font-family:"Archivo",sans-serif; font-weight:700; font-size:24px;
          display:block; line-height:1.1; }
        .f-statl { font-size:11.5px; color:var(--muted); }

        .f-keep { background:var(--surface); color:var(--ground); border-radius:3px;
          padding:16px; margin-bottom:14px; }
        .f-keep .f-lab { color:var(--acid); }
        .f-keep .f-statn { color:var(--acid); }
        .f-keep .f-statl { color:var(--on-surface); }

        .f-strip { display:flex; gap:4px; align-items:flex-end; height:52px;
          border-bottom:1px solid var(--ink); margin:16px 0 2px; }
        .f-scol { flex:1 1 0; min-width:0; display:flex; align-items:flex-end; height:100%; }
        .f-sbar { width:100%; background:var(--hard); border-radius:2px 2px 0 0; }
        .f-sbar[data-low="1"] { background:var(--warn); }

        .f-months { width:100%; border-collapse:collapse; margin-top:16px; font-size:13.5px; }
        .f-months td { padding:8px 0; border-bottom:1px solid var(--rule); color:var(--muted); }
        .f-months td:nth-child(2) { text-align:center; }
        .f-months td:last-child { text-align:right; font-weight:600; color:var(--ink); }
        .f-months tr:last-child td { border-bottom:none; }
        .f-months tr[data-cur="1"] td { color:var(--ink); }
        .f-months tr[data-cur="1"] td:last-child { color:var(--hard); }

        .f-set { display:flex; gap:10px; align-items:center; margin-bottom:9px; }
        .f-set label { font-size:13px; width:52px; color:var(--muted); flex:0 0 auto; }
        .f-set input { flex:1 1 0; min-width:0; font:inherit; font-size:14px;
          background:var(--card); border:1px solid var(--rule); color:var(--ink);
          padding:9px 10px; border-radius:3px; }

        .f-quote { font-family:"Archivo",sans-serif; font-weight:700; font-size:15px;
          letter-spacing:-0.01em; background:var(--surface); color:var(--acid);
          padding:11px 13px; border-radius:3px; margin:10px 0; }

        @media (prefers-reduced-motion:reduce) { * { transition:none !important; } }
        @media (max-width:420px) {
          .f-wrap { padding:0 13px; }
          .f-bar + .f-wrap { padding-top:16px; }
          .f-logo { font-size:21px; }
          .f-big { font-size:36px; }
          .f-plateline { font-size:23px; }
          .f-track { height:60px; }
          .f-wplot { height:56px; }
          .f-moodbtn { width:42px; height:42px; }
        }
